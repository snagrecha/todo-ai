[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-ai"
version = "0.1.0"
description = "A task list management system for AI agents with multiple storage strategies and MCP server support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "snagrecha" }
]
keywords = ["ai", "agents", "todo", "task-management", "mcp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
todo-ai-mcp = "todo_ai.mcp_server:main"

[project.urls]
Homepage = "https://github.com/snagrecha/todo-ai"
Repository = "https://github.com/snagrecha/todo-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_ai"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["todo_ai"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/todo_ai --cov-report=term-missing"
